[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supplylens-agent"
version = "0.1.0"
description = "Evidence-based procurement arrival analysis with a bounded tool-calling agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "pymysql[rsa]>=1.1,<2",
  "langgraph>=1.0,<2", "langchain-core>=1.0,<2", "langchain-openai>=1.0,<2",
  "numpy>=1.26,<3", "httpx>=0.27,<1", "streamlit>=1.40,<2",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
supplylens = "supplylens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

