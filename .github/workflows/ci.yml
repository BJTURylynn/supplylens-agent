name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests ui
      - run: uv run pytest -q
      - run: uv run supplylens evaluate --mode demo --output evaluation/results/ci-demo.json
      - uses: actions/upload-artifact@v4
        with:
          name: demo-evaluation-${{ matrix.python }}
          path: evaluation/results/ci-demo.json
